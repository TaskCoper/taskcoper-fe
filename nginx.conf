map $status $monitor_log_level {
    ~^5 Error;
    ~^4 Warning;
    default Information;
}

map $hostname $monitor_service_name {
    ~^htm-taskcoper-client htm-taskcoper-client;
    ~^taskcoper-client taskcoper-client;
    default $hostname;
}

map $hostname $monitor_environment_name {
    ~-(dev)$ Development;
    ~-(demo)$ Demo;
    ~-(prod)$ Production;
    default Unknown;
}

log_format monitoring_json escape=json
    '{"@t":"$time_iso8601",'
    '"@l":"$monitor_log_level",'
    '"@mt":"HTTP request completed {EventName} {RequestMethod} {RequestPath} {StatusCode} {ElapsedSeconds} {RequestId} {RemoteAddress}",'
    '"ServiceName":"$monitor_service_name",'
    '"EnvironmentName":"$monitor_environment_name",'
    '"EventName":"http.request.completed",'
    '"RequestMethod":"$request_method",'
    '"RequestPath":"$uri",'
    '"StatusCode":$status,'
    '"ElapsedSeconds":$request_time,'
    '"RequestId":"$request_id",'
    '"RemoteAddress":"$remote_addr"}';

server {
    listen 80;

    access_log /var/log/nginx/access.log monitoring_json;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html =404;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

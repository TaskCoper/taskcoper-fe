name: Deploy Production Server
on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
      run-on:
        required: false
        default: self-hosted
        type: string
      tag:
        required: false
        default: develop-latest
        type: string
      environment:
        required: false
        default: dev
        type: string
jobs:
  deploy-application:
    runs-on: ${{ inputs.run-on }}
    env:
      REGISTRY: ghcr.io/${{ inputs.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Lowercase Repository Name
        run: |
          REPO_LOWER=$(echo "${{ inputs.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV
      - name: Pull New Image From Registry
        run: docker compose -f .docker/compose.yaml -p taskcoper-${{ inputs.profile }} --profile client-${{ inputs.profile }} pull

      - name: Deploy New Image
        run: docker compose -f .docker/compose.yaml -p taskcoper-${{ inputs.profile }} --profile ${{ inputs.environment }} up -d

      - name: Prune Old Image
        run: docker image prune -af

      - name: Notify Deployment Success
        run: |
          echo "Deployment completed successfully!"
          echo "Client is running and healthy"

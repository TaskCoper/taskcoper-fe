name: Deploy Production Server
on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
      run-on:
        required: false
        default: self-hosted
        type: string
      tag:
        required: false
        default: dev-latest
        type: string
jobs:
  deploy-application:
    name: Deploy / ${{ inputs.profile }}
    runs-on: ${{ inputs['run-on'] }}
    timeout-minutes: 15
    environment: ${{ inputs.profile }}
    concurrency:
      group: deploy-taskcoper-client-${{ inputs.profile }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ghcr.io/${{ inputs.repository }}
      TAG: ${{ inputs.tag }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      FILE_BASE_URL: ${{ secrets.FILE_BASE_URL }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      GOONG_MAP_API_KEY: ${{ secrets.GOONG_MAP_API_KEY }}
      GOONG_MAP_TILE_API_KEY: ${{ secrets.GOONG_MAP_TILE_API_KEY }}
      VIETMAP_API_KEY: ${{ secrets.VIETMAP_API_KEY }}
      VIETMAP_MAP_API_KEY: ${{ secrets.VIETMAP_MAP_API_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        shell: bash
        run: |
          REPO_LOWER=$(echo "${{ inputs.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> "$GITHUB_ENV"
      - name: Pull New Image From Registry
        shell: bash
        run: >-
          docker compose -f .docker/compose.yaml
          -p taskcoper-client-${{ inputs.profile }}
          --profile client-${{ inputs.profile }} pull

      - name: Deploy New Image
        shell: bash
        run: >-
          docker compose -f .docker/compose.yaml
          -p taskcoper-client-${{ inputs.profile }}
          --profile ${{ inputs.profile }} up -d --no-build
          --wait --wait-timeout 120

      - name: Prune Old Image
        run: docker image prune -f --filter "until=24h"

      - name: Notify Deployment Success
        run: echo "Deployment completed successfully; client is healthy."

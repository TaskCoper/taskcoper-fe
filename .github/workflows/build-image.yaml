name: Build Image
on:
  workflow_call:
    inputs:
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
      environment:
        required: false
        default: dev
        type: string
jobs:
  build-service-image:
    name: Build Service Image
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ inputs.repository }}
      TAG: ${{ inputs.environment }}-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase Repository Name
        run: |
          REPO_LOWER=$(echo "${{ inputs.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV
      - name: Build and Push Image
        env:
          PROFILE: ${{ inputs.environment }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          FILE_BASE_URL: ${{ secrets.FILE_BASE_URL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          GOONG_MAP_API_KEY: ${{ secrets.GOONG_MAP_API_KEY }}
          GOONG_MAP_TILE_API_KEY: ${{ secrets.GOONG_MAP_TILE_API_KEY }}
          VIETMAP_API_KEY: ${{ secrets.VIETMAP_API_KEY }}
          VIETMAP_MAP_API_KEY: ${{ secrets.VIETMAP_MAP_API_KEY }}
        run: |
          docker compose -f .docker/compose.yaml --profile "$PROFILE" build --parallel
          docker compose -f .docker/compose.yaml --profile "$PROFILE" push

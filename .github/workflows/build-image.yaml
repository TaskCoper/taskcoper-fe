name: Build Image
on:
  workflow_call:
    inputs:
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
      environment:
        required: false
        default: dev
        type: string
jobs:
  build-service-image:
    name: Build Service Image
    runs-on: [ubuntu-latest]
    environment: ${{ inputs.environment }}
    env:
      REGISTRY: ghcr.io/${{ inputs.repository }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase Repository Name
        run: |
          REPO_LOWER=$(echo "${{ inputs.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV
      - name: Set TAG environment variable base on commit brand
        run: |
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "TAG=dev-latest" >> $GITHUB_ENV
          else
            echo "TAG=prod-latest" >> $GITHUB_ENV
          fi
      - name: Build and Push Image
        env:
          PROFILE: ${{ inputs.environment }}
          TAG: ${{ env.TAG }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          FILE_BASE_URL: ${{ secrets.FILE_BASE_URL }}
        run: |
          docker compose -f .docker/compose.yaml --profile "$PROFILE" build --parallel
          docker compose -f .docker/compose.yaml --profile "$PROFILE" push

name: Deploy Application
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
jobs:
  build-client-dev:
    name: Build / Client / Dev
    if: ${{ github.ref == 'refs/heads/dev' }}
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      actor: ${{ github.actor }}
      repository: ${{ github.repository }}
      environment: dev

  build-client-prod:
    name: Build / Client / Prod
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      actor: ${{ github.actor }}
      repository: ${{ github.repository }}
      environment: prod

  deploy-client-dev:
    name: Deploy / Dev / Client
    needs: build-client-dev
    permissions:
      contents: read
      packages: write
    if: ${{ github.ref == 'refs/heads/dev' }}
    uses: ./.github/workflows/deploy-application.yaml
    with:
      actor: ${{ github.actor }}
      repository: ${{ github.repository }}
      profile: dev
      tag: dev-latest
    secrets: inherit

  deploy-client-prod:
    name: Deploy / Prod / Client
    needs: build-client-prod
    permissions:
      contents: read
      packages: write
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/deploy-application.yaml
    with:
      actor: ${{ github.actor }}
      repository: ${{ github.repository }}
      profile: prod
      tag: prod-latest
    secrets: inherit

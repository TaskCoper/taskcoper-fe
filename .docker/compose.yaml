x-client-base: &client-base
  image: ${REGISTRY}/taskcoper-client:${TAG:-latest}
  restart: unless-stopped
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      FILE_BASE_URL: ${FILE_BASE_URL:?FILE_BASE_URL is required}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      GOONG_MAP_API_KEY: ${GOONG_MAP_API_KEY:?GOONG_MAP_API_KEY is required}
      GOONG_MAP_TILE_API_KEY: ${GOONG_MAP_TILE_API_KEY:?GOONG_MAP_TILE_API_KEY is required}
      VIETMAP_API_KEY: ${VIETMAP_API_KEY:?VIETMAP_API_KEY is required}
      VIETMAP_MAP_API_KEY: ${VIETMAP_MAP_API_KEY:?VIETMAP_MAP_API_KEY is required}
  environment:
    TZ: UTC
  healthcheck:
    test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s

services:
  taskcoper-client-dev:
    <<: *client-base
    container_name: taskcoper-client-dev
    hostname: taskcoper-client-dev
    networks: [taskcoper-network-dev]
    profiles: [dev, client-dev, client]

  taskcoper-client-prod:
    <<: *client-base
    container_name: taskcoper-client-prod
    hostname: taskcoper-client-prod
    networks: [taskcoper-network-prod]
    profiles: [prod, client-prod, client]

  taskcoper-client-htm-dev:
    <<: *client-base
    container_name: htm-taskcoper-client-dev
    hostname: htm-taskcoper-client-dev
    networks: [hoatheomua-network-dev]
    profiles: [htm-dev, client-htm-dev, client]

  taskcoper-client-htm-prod:
    <<: *client-base
    container_name: htm-taskcoper-client-prod
    hostname: htm-taskcoper-client-prod
    networks: [hoatheomua-network-prod]
    profiles: [htm-prod, client-htm-prod, client]

networks:
  taskcoper-network-prod:
    name: taskcoper-network-prod
    driver: bridge
    external: true
    ipam:
      driver: default

  taskcoper-network-dev:
    name: taskcoper-network-dev
    driver: bridge
    external: true
    ipam:
      driver: default

  # htm-dev shares hoatheomua-be's dev network so the gateway can reach htm-taskcoper-client-dev.
  # Owned/created by hoatheomua-be's dev compose - must already exist before `up` of the htm-dev profile.
  hoatheomua-network-dev:
    name: hoatheomua-network-dev
    external: true

  # htm-prod shares hoatheomua-be's prod network on the HoaTheoMua runner.
  # Owned/created by hoatheomua-be's prod compose — it must exist before deployment.
  hoatheomua-network-prod:
    name: hoatheomua-network-prod
    external: true

x-client-base: &client-base
  image: ${REGISTRY}/taskcoper-client:${TAG:-latest}
  restart: unless-stopped
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      API_BASE_URL: ${API_BASE_URL}
      FILE_BASE_URL: ${FILE_BASE_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      GOONG_MAP_API_KEY: ${GOONG_MAP_API_KEY}
      GOONG_MAP_TILE_API_KEY: ${GOONG_MAP_TILE_API_KEY}
      VIETMAP_API_KEY: ${VIETMAP_API_KEY}
      VIETMAP_MAP_API_KEY: ${VIETMAP_MAP_API_KEY}
  environment:
    TZ: UTC

services:
  taskcoper-client-dev:
    <<: *client-base
    container_name: taskcoper-client-dev
    hostname: taskcoper-client-dev
    networks: [taskcoper-network-dev]
    profiles: [dev, client-dev, client]

  taskcoper-client-prod:
    <<: *client-base
    container_name: taskcoper-client-prod
    hostname: taskcoper-client-prod
    networks: [taskcoper-network-prod]
    profiles: [prod, client-prod, client]

  taskcoper-client-htm-dev:
    <<: *client-base
    container_name: htm-taskcoper-client-dev
    hostname: htm-taskcoper-client-dev
    networks: [hoatheomua-network-dev]
    profiles: [htm-dev, client-htm-dev, client]

networks:
  taskcoper-network-prod:
    name: taskcoper-network-prod
    driver: bridge
    external: true
    ipam:
      driver: default

  taskcoper-network-dev:
    name: taskcoper-network-dev
    driver: bridge
    external: true
    ipam:
      driver: default

  # htm-dev shares hoatheomua-be's dev network so the gateway can reach htm-taskcoper-client-dev.
  # Owned/created by hoatheomua-be's dev compose - must already exist before `up` of the htm-dev profile.
  hoatheomua-network-dev:
    name: hoatheomua-network-dev
    external: true

services:
  taskcoper-client:
    build:
      dockerfile: Dockerfile
      context: ..
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_FILE_BASE_URL: ${VITE_FILE_BASE_URL}
    restart: unless-stopped
    container_name: taskcoper-client
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_FILE_BASE_URL: ${VITE_FILE_BASE_URL}
    networks:
      - taskcoper-network

networks:
  taskcoper-network:
    name: taskcoper-network
    driver: bridge
    ipam:
      driver: default
